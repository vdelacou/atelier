# Format: window-invisible <role> <agent> <worktree> [task|batch] [forward-only|back-one|back-all] [extra-cli-args...]
# Six Claude Code agents. The receive mode defaults to task; a batch role takes
# every queued handoff of one priority as a single unit. Propagation defaults to
# forward-only; back-one and back-all queue merge-only copies to earlier roles.
# The launcher adds --permission-mode bypassPermissions to every claude line.
# The specifier keeps this exact name and the master worktree: the daemon holds
# a git_handoff for operator approval (Attention) only when both are true.
window-invisible specifier claude master
window-invisible coder claude coder
window-invisible cleaner claude cleaner batch back-one
window-invisible architect claude architect batch back-all
window-invisible hardener claude hardener batch
window-invisible reviewer claude reviewer batch back-all

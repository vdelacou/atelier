# .github/workflows/ci.yml for the Next.js variant - the authoritative gate set (rules 4.6, 15.1)
#
# The simple-git-hooks pre-commit (gate 2, then test and lint per package; commitlint on
# the message) is the fast first line; this is the one that cannot be skipped with
# --no-verify: make it a required status check in branch protection (rule 13.2,
# governance.md), and nothing merges while it is red. Same grammar as the hook for the
# commit messages (commitlint, config-conventional) over the pushed range, gate 2 over
# every manifest, the secret scan over the full history, then test, lint, typecheck and
# build for every workspace on a frozen lockfile, and the bundle budget on each export.
# No coverage or mutation step: the Next variant has neither gate (SKILL.md, What applies
# where); its test-driven surface is src/lib and src/config.
#
# Actions are pinned to major tags for readability; pin to a commit SHA for
# supply-chain safety in a real repo (rule 5.4).
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # The left side of the pushed range for the two commit gates. On a push to main HEAD
      # already equals origin/main, so without this they would check an empty range and
      # pass vacuously. Empty on a pull request (the base ref wins).
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      # The gzipped ceiling per exported package, in KB (canon 17.7); a bump is a reviewed change.
      BUDGET_KB: 250
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks detect and the commit gates
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile # lockfile drift fails here (rule 5.3)
      - name: commit messages (Conventional Commits through commitlint, the hook's grammar, rule 23 / canon 1.3)
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --quiet origin "$GITHUB_BASE_REF"
            from="origin/${GITHUB_BASE_REF}"
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            from="$GITHUB_EVENT_BEFORE"
          else
            from="HEAD~1"
          fi
          bunx --yes commitlint --from "$from" --to HEAD --verbose
      - name: commit size per commit in the range (gate 1 / canon 8.1)
        run: bash scripts/check-commit-range.sh
      - name: package.json (rules 5 and 19, no latest, no foreign lockfile, no node or npm in scripts)
        run: bash scripts/check-package-json.sh
      - name: install gitleaks (pinned; not preinstalled on ubuntu runners)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/ && rm gitleaks
      - name: secret scan (full history)
        run: gitleaks detect --redact --no-banner
      - name: tests (random order, rule 36)
        run: bun run --filter '*' test
      - name: lint (zero errors AND zero warnings, rule 15)
        run: bun run --filter '*' lint
      - name: typecheck
        run: bun run --filter '*' typecheck
      - name: build (static export)
        run: bun run --filter '*' build
      - name: bundle budget per exported package (canon 17.7)
        run: |
          for out in packages/*/out; do
            [ -d "$out" ] || continue
            bash scripts/check-bundle-size.sh "$out"
          done

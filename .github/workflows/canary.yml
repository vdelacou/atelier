name: ts-pin-lift-canary

# The Bun smoke test pins typescript@^5 because eslint-plugin-sonarjs crashes
# under TypeScript 7 (see .claude/LESSONS.md, 2026-07-12). This weekly canary
# runs the same smoke test UNPINNED, so the week sonarjs ships TS 7 support the
# job turns green and the pin can be lifted. It never blocks anything; check
# the Actions page (or the badge) when curious.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  unpinned-typescript:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: smoke test with typescript unpinned
        run: SMOKE_TS_SPEC=typescript bash scripts/smoke-test.sh
      - name: green means the pin can be lifted
        run: echo "typescript unpinned passes; lift the ^5 pin in scripts/smoke-test.sh and bun-typescript.md, and update the LESSONS entry"

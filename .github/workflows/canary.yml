name: toolchain-canary

# Three weekly probes of deliberate toolchain concessions. None blocks
# anything; check the Actions page (or the badge) when curious.
#
# 1. The Bun smoke test pins typescript@^5 because eslint-plugin-sonarjs crashes
#    under TypeScript 7 (see .claude/LESSONS.md, 2026-07-12). unpinned-typescript
#    runs the same smoke test UNPINNED, so the week sonarjs ships TS 7 support
#    the job turns green and the pin can be lifted.
# 2. The canonical eslint config turns off three sonarjs rules that flag
#    conforming code: no-useless-intersection and null-dereference (see
#    LESSONS.md, 2026-08-29) and function-return-type, which reports every
#    function returning through the ok()/err() helpers (2026-09-05).
#    sonarjs-rule-probe turns them back on and reports whether upstream has
#    fixed the false positives.
# 3. The standard stays on ESLint (2026-09-27): Oxlint matched every smoke
#    fixture but two, it has no noInlineConfig (rule 15) and its JS plugins
#    get no type information (the typed sonarjs rules). oxlint-parity-probe
#    reads both gaps and says when a switch could keep every function.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

# read-only token: no job here writes to the repository
permissions:
  contents: read

jobs:
  unpinned-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: smoke test with typescript unpinned
        run: SMOKE_TS_SPEC=typescript bash scripts/smoke-test.sh
      - name: green means the pin can be lifted
        run: echo "typescript unpinned passes; lift the ^5 pin in scripts/smoke-test.sh and bun-typescript.md, and update the LESSONS entry"

  sonarjs-rule-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # The probe re-enables the three disabled rules and prints its verdict in
      # the smoke-test output. Read the "PROBE:" line: it says whether they can
      # go back on. The job itself stays green either way.
      - name: smoke test with the disabled sonarjs rules re-enabled
        run: SMOKE_SONARJS_PROBE=1 bash scripts/smoke-test.sh

  oxlint-parity-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Oxlint's npm launcher needs Node 20.19+ or 22.12+.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # One line per gap, also in the run summary; a "PROBE:" line means
      # something changed. The job fails only when a control fails, i.e.
      # the probe itself broke (see the script's header).
      - name: read the two gaps that keep the standard on ESLint
        run: bash scripts/oxlint-parity-probe.sh

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-frontmatter:
    name: skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun run scripts/validate-frontmatter.ts

  asset-smoke-test:
    name: asset smoke test (Bun variant, all gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # Deliberately unpinned toolchain inside the smoke test: a new ESLint /
      # TypeScript / Stryker major that breaks a shipped asset or a documented
      # config should fail here before a user hits it.
      - run: bash scripts/smoke-test.sh

  next-smoke-test:
    name: next.js smoke test (rules 21-22 enforcement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # Scaffolds a Next.js package from the canonical configs in
      # references/nextjs-monorepo.md, then asserts conforming code passes and
      # rule 21/22 violations are caught — so a future ESLint/Next major can't
      # silently disable the design-system enforcement.
      - run: bash scripts/smoke-test-next.sh

  java-smoke-test:
    name: java smoke test (Quarkus variant, all gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # no `cache: maven` — it requires a pom.xml in the repo, and this
          # repo's pom is generated at runtime by the smoke test
      # Scaffolds a Maven repo from the canonical pom.xml in
      # references/java-quarkus.md and the shipped hook assets, then proves the
      # gate chain passes on a conforming tree (spotless, verify with JaCoCo
      # tiers, PIT, a full hooked commit) and blocks each target violation
      # (range, SNAPSHOT dep, oversized commit, junk message, misformatted
      # file, -Werror warning, untested class, surviving mutant).
      - run: bash scripts/smoke-test-java.sh
